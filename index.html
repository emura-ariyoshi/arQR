<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/aframe/1.2.0/aframe.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/ar.js/2.2.2/aframe-ar.min.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/donmccurdy/aframe-extras@v6.1.1/dist/aframe-extras.min.js"></script>
  </head>

  <body style="margin: 0; overflow: hidden;">
    <button id="startAudio" type="button" style="position: fixed; z-index: 10; top: 20px; left: 50%; transform: translateX(-50%); padding: 12px 18px; font-size: 16px;">
      音楽を再生
    </button>

    <audio id="birthdayAudio" src="./HappyBirthday.wav" loop preload="auto"></audio>

    <a-scene embedded vr-mode-ui="enabled: false" arjs="sourceType: webcam; debugUIEnabled: false; sourceWidth: 1280; sourceHeight: 960; displayWidth: 1280; displayHeight: 960;">
      <a-marker type="pattern" preset="custom" url="./pattern-QR.patt" patternRatio="0.5">
        <a-entity id="cakeModel"
          gltf-model="url(./20260912ケーキ.glb)"
          position="0 0 0"
          rotation="0 0 0"
          scale="0.1 0.1 0.1"
          animation-mixer>
        </a-entity>

      </a-marker>
      <a-entity camera></a-entity>
    </a-scene>

    <script>
      const audio = document.querySelector('#birthdayAudio');
      const startAudio = document.querySelector('#startAudio');
      let audioUnlocked = false;

      async function unlockAudio() {
        try {
          audio.muted = true;
          await audio.play();
          audio.pause();
          audio.currentTime = 0;
          audio.muted = false;
          audioUnlocked = true;
        } catch (error) {
          console.error('音声を有効にできませんでした:', error);
        }
      }

      startAudio.addEventListener('click', async () => {
        await unlockAudio();
        if (!audioUnlocked) return;

        audio.play().catch((error) => console.error('音声を再生できませんでした:', error));
        startAudio.textContent = '音楽再生中';
        startAudio.disabled = true;
      });
    </script>
  </body>
</html>
