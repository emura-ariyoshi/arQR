<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/aframe/1.2.0/aframe.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/ar.js/2.2.2/aframe-ar.min.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/donmccurdy/aframe-extras@v6.1.1/dist/aframe-extras.min.js"></script>
  </head>

  <body style="margin: 0; overflow: hidden;">
    <a-scene embedded arjs="sourceType: webcam; debugUIEnabled: false;">
      <a-marker type="pattern" preset="custom" url="./pattern-QR.patt" patternRatio="0.5</a-marker>">
        <a-entity
          gltf-model="url(./20260912ケーキ.glb)"
          position="0 0 0"
          rotation="-45 0 0"
          scale="0.5 0.5 0.5"
          animation-mixer>
        </a-entity>

        <audio id="birthdayAudio" src="./HappyBirthday.wav" loop></audio>
      </a-marker>
      <a-entity camera></a-entity>
    </a-scene>

    <script>
      const audio = document.getElementById('birthdayAudio');
      const marker = document.querySelector('a-marker');

      function startAudio() {
        if (!audio) return;
        audio.play().catch(() => {
          console.log('音声再生はユーザー操作が必要です');
        });
      }

      if (marker) {
        marker.addEventListener('markerFound', startAudio);
      }

      document.addEventListener('click', () => {
        if (audio && audio.paused) {
          startAudio();
        }
      });
    </script>
  </body>
</html>
